# =============================================================================
# news.quickcelebfacts.com — host nginx site config
# =============================================================================
# Install to /home/conf/qcfnews.conf and include it from the http { } block of
# /etc/nginx/nginx.conf:
#
#     sudo install -d /home/conf
#     sudo cp nginx/news.quickcelebfacts.com.conf /home/conf/qcfnews.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# It MUST be inside `http { }`.  server, upstream and limit_req_zone are all
# http-context directives; included at the top level nginx refuses to start with
# "server directive is not allowed here".
#
# Everything outside a `server` block below is global to this nginx, which is
# why both zone names carry a `qcfnews_` prefix — an unprefixed `zone=global`
# collides with any other site on the host.  Every proxy_set_header and every
# set_real_ip_from sits INSIDE the server block for the same reason.
#
# Assumes:  frontend (Next)    127.0.0.1:3000
#           backend  (FastAPI) 127.0.0.1:8000
#           TLS via a Cloudflare Origin CA certificate, zone in Full (strict)
# =============================================================================

upstream qcfnews_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream qcfnews_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Outer per-IP budget, keyed on the REAL visitor address — see the realip block
# in the server below, without which this buckets the whole internet into
# Cloudflare's ~15 edge ranges and throttles the site globally.
limit_req_zone $binary_remote_addr zone=qcfnews_global:10m rate=30r/s;

# A much tighter budget for admin login.  The application's own 5-per-minute
# rule lives in Redis and FAILS OPEN when Redis is unavailable
# (Backend/src/utils/rate_limit.py) — it logs a warning and allows the request.
# This zone is the layer that keeps working when that one doesn't.
limit_req_zone $binary_remote_addr zone=qcfnews_login:10m rate=10r/m;


# ── Plain HTTP ───────────────────────────────────────────────────────────────
# Nothing legitimate arrives here: Cloudflare connects over 443 in Full (strict),
# and the security group shuts :80 to everything but Cloudflare's ranges.  Kept
# as a redirect so a stray request is answered rather than left hanging.
server {
    listen 80;
    listen [::]:80;
    server_name news.quickcelebfacts.com;

    return 301 https://$host$request_uri;
}


server {
    # `ssl http2` is the spelling nginx < 1.25.1 understands, and Ubuntu 24.04
    # ships 1.24.0.  `http2 on;` there is an unknown directive and nginx refuses
    # to start.  On 1.25.1+ switch to:
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name news.quickcelebfacts.com;

    # No www. variant on purpose.  www.news.quickcelebfacts.com is a SECOND-level
    # subdomain, and Cloudflare's Universal SSL certificate covers the apex plus
    # one level only — it would be the one hostname on the zone with no valid
    # edge certificate.  Don't create the DNS record either.

    server_tokens off;

    access_log /var/log/nginx/qcfnews.access.log;
    error_log  /var/log/nginx/qcfnews.error.log warn;

    # ── Cloudflare Origin CA certificate ─────────────────────────────────────
    # Signed by Cloudflare's private origin CA: valid only for connections from
    # the Cloudflare edge, and NOT trusted by any browser.  Grey-clouding the DNS
    # record produces a hard certificate error, not a click-through warning.
    # Valid up to 15 years, no certbot, no renewal job — put the expiry in a
    # calendar, because nothing here will remind you.
    ssl_certificate     /etc/ssl/cloudflare/qcfnews.pem;
    ssl_certificate_key /etc/ssl/cloudflare/qcfnews.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # No OCSP stapling: the Origin CA certificate has no OCSP responder, and
    # `ssl_stapling on` would only log a warning on every reload.

    # ── Authenticated Origin Pulls (optional, recommended) ───────────────────
    # Proves the connection really came from Cloudflare rather than from someone
    # who found the origin IP.  Survives Cloudflare adding an IP range, which the
    # security-group allow-list does not.  Download the origin-pull CA to the
    # path below, uncomment both lines, and enable it at
    # SSL/TLS → Origin Server → Authenticated Origin Pulls.
    #
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    # ── Restore the visitor's IP ─────────────────────────────────────────────
    # LOAD-BEARING.  Every request arrives from a Cloudflare edge address, so
    # without this $remote_addr is Cloudflare and:
    #
    #   • the limit_req zones above bucket the whole internet into ~15 ranges;
    #   • the backend's 5-per-minute login cap locks out every reader after five
    #     global attempts;
    #   • newsletter_subscribers records Cloudflare as the consenting party,
    #     which is not evidence of anything.
    #
    # CF-Connecting-IP carries exactly one address and Cloudflare overwrites it
    # on every request, so it cannot be forged — but only when the connection
    # genuinely came from a Cloudflare range, which is what set_real_ip_from
    # checks.  A non-Cloudflare peer falls back to its own socket address.
    # NEVER widen these to 0.0.0.0/0.
    #
    # Also note: the default `combined` log format logs $remote_addr, which
    # realip has already rewritten — so the access log above carries true
    # visitor addresses with no custom log_format needed.
    #
    # Ranges as published 2026-08-29 (https://www.cloudflare.com/ips/).
    # Re-check them whenever you touch the security group.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;

    # 100 M, matching Cloudflare's own request-body cap exactly: anything the
    # edge would forward, this origin accepts.  Raising it past 100 M buys
    # nothing — Cloudflare rejects first, with a 413 at the edge that never
    # reaches this server and appears in no log you control.  Keep the backend's
    # MAX_IMAGE_SIZE_MB × MAX_IMAGES_PER_UPLOAD under this (10 × 9 = 90 M).
    client_max_body_size 100M;

    # ── Proxy defaults ───────────────────────────────────────────────────────
    # Inside the server block on purpose: at http level these would apply to
    # every other site this nginx serves.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # $remote_addr — which realip has just rewritten to the true visitor — and
    # deliberately NOT $proxy_add_x_forwarded_for.
    #
    # The backend runs RATE_LIMIT_TRUST_PROXY=True and believes the LEFT-MOST
    # X-Forwarded-For entry (Backend/src/utils/client_ip.py:34).  Cloudflare
    # forwards the client's own X-Forwarded-For inside the chain it builds, so
    # appending would put an attacker-chosen value in front of the real one:
    # a fresh rate-limit identity per request, which is the same thing as no
    # rate limit at all.  Overwriting is what makes the header trustworthy.
    proxy_set_header   X-Forwarded-For   $remote_addr;

    # Shorter than Cloudflare's own 100 s cutoff, so a slow request fails here
    # and is logged rather than surfacing to the visitor as an opaque 524.
    proxy_connect_timeout 10s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    # Cloudflare compresses at the edge too; this keeps the origin→edge hop small
    # and costs almost nothing.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── HSTS ─────────────────────────────────────────────────────────────────
    # Prefer Cloudflare's own toggle (SSL/TLS → Edge Certificates → HSTS): the
    # edge certificate is the one browsers validate, and the dashboard control is
    # reversible in a way this header is not.  If you set it here instead, do so
    # only after verifying HTTPS end to end — it tells browsers to refuse plain
    # HTTP to this host for a year and cannot be recalled.
    #
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # ═════════════════════════════════════════════════════════════════════════
    # ROUTING
    #
    # nginx picks the LONGEST matching prefix and an exact (=) match beats every
    # prefix, so the order of these blocks in the file does not matter.  What
    # matters is that /api/admin/*, /api/revalidate and /api/newsletter/* live in
    # the NEXT app, not in FastAPI.  Send them to the backend and admin login,
    # cache invalidation and newsletter signup all 404 — silently, with nothing
    # in any log naming the cause.
    # ═════════════════════════════════════════════════════════════════════════

    # ── Admin login: exact match, tight budget ───────────────────────────────
    # Beats the /api/admin/ prefix below.  See the qcfnews_login zone comment.
    location = /api/admin/session/login {
        limit_req zone=qcfnews_login burst=5 nodelay;
        proxy_pass http://qcfnews_frontend;
    }

    # ── Frontend: the BFF routes ─────────────────────────────────────────────
    location /api/admin/ {
        limit_req zone=qcfnews_global burst=50 nodelay;
        proxy_pass http://qcfnews_frontend;
    }

    location /api/revalidate {
        proxy_pass http://qcfnews_frontend;
    }

    location /api/newsletter/ {
        limit_req zone=qcfnews_global burst=20 nodelay;
        proxy_pass http://qcfnews_frontend;
    }

    # ── Backend: RFC 8058 one-click unsubscribe ──────────────────────────────
    # The ONE /api/v1 path that must stay publicly reachable.  Newsletter emails
    # carry `List-Unsubscribe-Post: List-Unsubscribe=One-Click` naming this URL
    # (Backend/src/apps/v1/newsletter/emails.py:41), and Gmail and Yahoo require
    # that header of bulk senders.  Mail providers POST here directly; there is
    # no browser and no BFF hop involved, so removing it silently breaks
    # one-click opt-out and, with it, deliverability.
    #
    # Only relevant once NEWSLETTER_ENABLED=True, but correct from the start.
    #
    # Generous burst on purpose: these POSTs arrive from a mail provider's own
    # servers, so many readers unsubscribing share one source address.  (The
    # backend's own 10/300 rule on this path keys on that same address and may
    # need widening if you ever send at volume.)
    location = /api/v1/newsletter/unsubscribe {
        limit_req zone=qcfnews_global burst=50 nodelay;
        proxy_pass http://qcfnews_backend;
    }

    # ── Backend: the rest of the API — deliberately NOT proxied ──────────────
    # Nothing in a browser calls /api/v1: the site talks only to the Next BFF
    # routes above, and server-side calls go over the Docker network straight to
    # backend:8000, never through nginx.  Leaving the API off the internet takes
    # unauthenticated POST /api/v1/users/register — public self-registration on
    # an editorial CMS — off it too (audit P2-2).
    #
    # Restore this ONLY if you gain an API client outside the site itself:
    #
    # location /api/ {
    #     limit_req zone=qcfnews_global burst=50 nodelay;
    #     proxy_pass http://qcfnews_backend;
    # }

    # ── Backend: uploaded media ──────────────────────────────────────────────
    # Upload filenames carry a uuid4 suffix (Backend/src/utils/storage.py), so a
    # given URL never changes content and `immutable` is safe.  Cloudflare caches
    # these at the edge, so most requests never reach this origin at all.
    location /media/ {
        proxy_pass http://qcfnews_backend;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ── Backend: health ──────────────────────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://qcfnews_backend;
    }

    # ── Backend: API docs — left unproxied ───────────────────────────────────
    # ENABLE_API_DOCS=False in production, so /docs, /redoc and /openapi.json
    # already 404 at the app.  Not proxying them means they are unreachable even
    # if that flag is ever flipped by accident.

    # ── Frontend: immutable build assets ─────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://qcfnews_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Frontend: everything else ────────────────────────────────────────────
    # Pages, /admin, /feed.xml, /sitemap.xml, /robots.txt, /og/*, and Next's own
    # image optimiser.
    location / {
        proxy_pass http://qcfnews_frontend;
    }
}
