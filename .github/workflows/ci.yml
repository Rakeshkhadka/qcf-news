# =============================================================================
# QCF News — quality gate
# =============================================================================
# Frontend: lint, typecheck and build.  `npm run lint` was calling the removed
# `next lint` and had been silently failing, so nothing was enforced before.
#
# Backend: tests and migrations, against a real Postgres.  Nothing gated the
# backend at all until this job existed, and the suite was red when it was
# added — a rate-limit test asserting a message the code had stopped emitting.
#
# flake8 and mypy run advisory (`continue-on-error`) rather than blocking:
# there are 15 and 190 existing findings respectively, and a gate that is red
# on arrival gets ignored.  Drive those to zero, then drop the flag.
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches .nvmrc, package.json engines and the Dockerfile base image.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # The build only needs these to be well-formed URLs; nothing is
        # contacted at build time.
        env:
          API_INTERNAL_ORIGIN: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  backend:
    name: Tests · Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qcf_news
          # Deliberately full of the characters that used to break the
          # connection URL — `/`, `+`, `=` and `@` all appear in the passwords
          # `openssl rand -base64` generates.  Both URL builders escape their
          # components now, and this password is what keeps them honest.
          POSTGRES_PASSWORD: 'p/a+s=w@rd'
          POSTGRES_DB: qcf_news
        options: >-
          --health-cmd "pg_isready -U qcf_news -d qcf_news"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Matches the compose stack; the app reads these, not a DATABASE_URL.
      DB_NAME: qcf_news
      DB_USER: qcf_news
      DB_PASS: 'p/a+s=w@rd'
      DB_HOST: localhost
      DB_PORT: '5432'
      JWT_SECRET_KEY: ci-only-not-a-real-key
      JWT_REFRESH_SECRET_KEY: ci-only-not-a-real-key-either

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Backend/Dockerfile base image.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: pytest tests -q

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      - name: Migrations roll back
        # A migration that cannot be undone is one you cannot back out of at
        # 3am. Only the newest is exercised; a full downgrade is not free.
        run: alembic downgrade -1 && alembic upgrade head

      - name: Lint (advisory)
        continue-on-error: true
        run: flake8 src tests

      - name: Typecheck (advisory)
        continue-on-error: true
        run: mypy src
