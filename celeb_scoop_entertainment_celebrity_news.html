                                        <span class="text-[10px] font-bold text-secondary mb-2 uppercase">Feature</span>
                                        <h4 class="font-serif text-xl text-primary mb-3">Paris Fashion Week: The Celebrities Who Stole the Front Row</h4>
                                        <p class="text-sm text-on-surface-variant mb-4 line-clamp-2">A-listers flocked to Paris to witness the latest haute couture collections.</p>
                                    </article>
                                ))}
                            </div>
                            <aside class="space-y-12">
                                <div class="bg-white border border-outline-variant p-6">
                                    <h3 class="font-serif text-xl mb-6">Trending Celebs</h3>
                                    {[1, 2, 3].map(i => (
                                        <div key={i} class="group cursor-pointer py-4 border-b border-outline-variant last:border-0" onClick={() => navigate('/article')}>
                                            <div class="flex gap-4 items-start">
                                                <div class="text-3xl font-serif text-outline-variant group-hover:text-secondary opacity-50">{i}</div>
                                                <h4 class="font-serif text-base text-primary group-hover:text-secondary line-clamp-2">Zendaya's Vintage Gown Breaks the Internet</h4>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </aside>
                        </div>
                    </main>
                    <Footer />
                </div>
            );
        };

        const ArticlePage = () => {
            const navigate = useNavigate();
            const [scrollWidth, setScrollWidth] = useState(0);

            useEffect(() => {
                const handleScroll = () => {
                    const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    setScrollWidth((winScroll / height) * 100);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div class="bg-surface">
                    <div class="progress-bar" style={{width: `${scrollWidth}%`}}></div>
                    <Header title="THE DAILY BRIEF" />
                    <main class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-12">
                        <div class="grid grid-cols-12 gap-gutter">
                            <article class="col-span-12 lg:col-span-8">
                                <div class="mb-4">
                                    <span class="px-3 py-1 bg-secondary-container bg-opacity-10 text-secondary font-bold text-[10px] uppercase rounded">ENTERTAINMENT</span>
                                </div>
                                <h1 class="font-serif text-4xl md:text-5xl lg:text-6xl text-primary mb-6 leading-tight">
                                    Red Carpet Secrets: The Untold Story of the Year's Most Iconic Gown
                                </h1>
                                <h2 class="font-serif text-xl md:text-2xl text-on-surface-variant mb-8 leading-relaxed">
                                    Behind the seams of the dress that broke the internet, featuring exclusive interviews with the designer and the star who brought it to life.
                                </h2>
                                <div class="flex items-center justify-between border-y border-outline-variant/30 py-4 mb-8">
                                    <div class="flex items-center gap-4">
                                        <img class="w-12 h-12 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAW2erRGHGJ2yHjfoVPfNt3VjpIjVp0IBRIhc8s5-jSMw1ivLN2EDyVW1ev-fzmwOb6XqTXdLer5NV-IkkTuy5TCHi9nXamKKJ5Em45098bDIM3fgr-ty5tRaNNagkhjS0yiZHtsa2Q-gHpAmLlN2-0LsPUQdZE8mEEVFL-aMSC-IR25kYRFi_6msQI4gRdTyFaXLe7F0leIILYVhnU4fVyBMeEvHIMLMw43zFiHTIk6Jog2l885r0AQQ" />
                                        <div>
                                            <p class="text-sm font-bold text-primary">Eleanor Vance</p>
                                            <p class="text-xs text-on-surface-variant">Senior Style Editor</p>
                                        </div>
                                    </div>
                                    <div class="text-right text-xs text-on-surface-variant">
                                        <p>October 24, 2024</p>
                                        <p>7 Min Read</p>
                                    </div>
                                </div>
                                <figure class="mb-10">
                                    <img class="w-full h-auto rounded-lg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEiwPqQjcZkzIDP7XANvDtCp6Q6juIhBXDglorDZZ9daRR6OwxQSRg26MGSQz301JSB7SRD6gWk2S9qkaxi3qXOoQmeYV3PE2apYahcZaBp2KRJ4TO7isxcmr6StJIEFKEHBVRbv1P8FANPrD72K7dFlu7I9eGgVH4lfZ1uKIxd6_WxmLv2EDN_d5CsEtKoDP84c-aS18TQ2psKiVrAtTHaqkgN4P2kcwY7Q-cv2pnko1duu9F1mPR3A" />
                                    <figcaption class="mt-2 text-xs text-on-surface-variant text-right italic">Photo: Getty Images / Fashion Week Weekly</figcaption>
                                </figure>
                                <div class="text-lg leading-relaxed text-on-surface space-y-6">
                                    <p>The moment she stepped out of the black SUV, the collective gasp from the press pit was audible. It wasn't just a dress; it was an architectural marvel wrapped in silk and hand-sewn crystals.</p>
                                    <blockquote class="border-l-4 border-secondary pl-6 py-2 my-8 italic text-3xl font-serif text-primary">
                                        "We wanted to create something that didn't just reflect the light, but seemed to generate its own. It was about capturing the essence of a modern supernova."
                                    </blockquote>
                                    <p>Designed by an elusive atelier based in Milan, the gown took over 800 hours to construct. The process was shrouded in secrecy, with NDAs signed by everyone from the seamstresses to the delivery drivers.</p>
                                    <h3 class="font-serif text-2xl text-primary mt-8 mb-4">The Engineering Behind the Glamour</h3>
                                    <p>What the cameras didn't capture was the intricate internal corsetry required to support the weight of the embellishments. The gown weighed nearly 30 pounds, primarily due to the dense concentration of crystals.</p>
                                </div>
                            </article>
                            <aside class="col-span-12 lg:col-span-4 lg:pl-8 space-y-12">
                                <section>
                                    <h3 class="font-bold text-[10px] tracking-widest text-primary border-b border-outline-variant pb-2 mb-6 uppercase flex items-center gap-2">
                                        <span class="material-symbols-outlined text-secondary text-base">trending_up</span> Trending Now
                                    </h3>
                                    <ul class="space-y-6">
                                        {[
                                            {cat: "FILM", title: "Leading Man Walks Off Set After Disagreement"},
                                            {cat: "MUSIC", title: "Pop Sensation Teases Surprise Midnight Album Drop"},
                                            {cat: "ROYALS", title: "Palace Insiders Reveal Tension Over State Dinner"}
                                        ].map((item, i) => (
                                            <li key={i} class="group cursor-pointer" onClick={() => navigate('/')}>
                                                <span class="text-[10px] font-bold text-secondary mb-1 block uppercase tracking-widest">{item.cat}</span>
                                                <h4 class="font-serif text-lg text-primary group-hover:text-secondary transition-colors line-clamp-2">{item.title}</h4>
                                            </li>
                                        ))}
                                    </ul>
                                </section>
                                <div class="bg-surface-container-low p-6 rounded-lg border border-outline-variant">
                                    <h3 class="font-serif text-xl mb-2">The Daily Scoop</h3>
                                    <p class="text-sm text-on-surface-variant mb-4">Get the latest celebrity news delivered straight to your inbox.</p>
                                    <form class="flex flex-col gap-3" onSubmit={e => e.preventDefault()}>
                                        <input class="w-full px-4 py-2 border border-outline-variant rounded text-sm focus:ring-1 focus:ring-secondary outline-none" placeholder="Your email address" type="email" />
                                        <button class="bg-primary text-white font-bold text-xs py-2 rounded uppercase tracking-widest">Subscribe</button>
                                    </form>
                                </div>
                            </aside>
                        </div>
                    </main>
                    <Footer title="THE DAILY BRIEF" />
                </div>
            );
        };

        /**
         * Main App Component
         */

        const App = () => {
            const location = useLocation();

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [location]);

            return (
                <Routes>
                    <Route path="/" element={<HomePage />} />
                    <Route path="/feed" element={<FeedPage />} />
                    <Route path="/red-carpet" element={<RedCarpetPage />} />
                    <Route path="/article" element={<ArticlePage />} />
                </Routes>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(
            <MemoryRouter>
                <App />
            </MemoryRouter>
        );
    </script>
</body>
</html>
